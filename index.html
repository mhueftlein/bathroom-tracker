<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bathroom Cleaning Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .washroom-btn {
            padding: 30px 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .washroom-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .washroom-btn:active {
            transform: translateY(-2px);
        }
        
        .mens {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .womens {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .accessible {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .icon {
            font-size: 32px;
        }
        
        .divider {
            text-align: center;
            color: #999;
            margin: 30px 0;
            font-size: 14px;
        }
        
        .admin-links {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .admin-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .admin-btn:hover {
            background: #e0e0e0;
            border-color: #999;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Bathroom Cleaning Tracker</h1>
        <p class="subtitle">Select the bathroom you're cleaning</p>
        
        <div class="button-grid">
            <a href="form.html?bathroom=mens" class="washroom-btn mens">
                <span class="icon">👨</span>
                <span>Mens</span>
            </a>
            <a href="form.html?bathroom=womens" class="washroom-btn womens">
                <span class="icon">👩</span>
                <span>Womens</span>
            </a>
            <a href="form.html?bathroom=accessible" class="washroom-btn accessible">
                <span class="icon">♿</span>
                <span>Accessible</span>
            </a>
        </div>
        
        <div class="divider">OR</div>
        
        <div class="admin-links">
            <a href="dashboard.html" class="admin-btn">View Cleaning Records</a>
            <a href="settings.html" class="admin-btn">Settings</a>
        </div>
    </div>
</body>
</html>
