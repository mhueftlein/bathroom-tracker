<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Checklists</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        h1 {
            color: #000;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }
        
        .subtitle {
            color: #666;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 40px;
        }
        
        .washroom-btn {
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            text-decoration: none;
            background: #1f2937;
            text-transform: capitalize;
            letter-spacing: 0.3px;
        }
        
        .washroom-btn:hover {
            background: #111827;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
        }
        
        .washroom-btn:active {
            transform: translateY(0);
        }
        
        .divider {
            text-align: center;
            color: #d1d5db;
            margin: 40px 0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }
        
        .admin-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .admin-btn {
            padding: 16px 20px;
            background: #f3f4f6;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            color: #1f2937;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        
        .admin-btn:hover {
            background: #e5e7eb;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 0;
            }
            
            h1 {
                font-size: 32px;
            }
            
            .subtitle {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Facility Checklists</h1>
            <p class="subtitle">Select a checklist to complete</p>
        </div>
        
        <div style="margin-bottom: 32px;">
            <div style="color: #666; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; padding: 0 4px;">Bathroom Cleaning</div>
            <div class="button-grid">
                <a href="form.html?bathroom=mens" class="washroom-btn">Mens</a>
                <a href="form.html?bathroom=womens" class="washroom-btn">Womens</a>
                <a href="form.html?bathroom=accessible" class="washroom-btn">Accessible</a>
            </div>
        </div>
        
        <div style="margin-bottom: 32px;">
            <div style="color: #666; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; padding: 0 4px;">Shift Checklists</div>
            <div class="button-grid">
                <a href="opening.html" class="washroom-btn">Opening Shift</a>
                <a href="closing.html" class="washroom-btn">Closing Shift</a>
                <a href="weekly.html" class="washroom-btn">Weekly Cleaning</a>
            </div>
        </div>
        
        <div class="divider">Admin</div>
        
        <div class="admin-links">
            <a href="dashboard.html" class="admin-btn">View Records</a>
            <a href="settings.html" class="admin-btn">Settings</a>
        </div>
    </div>
</body>
</html>
