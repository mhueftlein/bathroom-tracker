<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaning Records Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 28px;
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button, .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .filter-group label {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        
        select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        thead {
            background: #f9f9f9;
            border-bottom: 2px solid #e0e0e0;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            color: #555;
        }
        
        tr:hover {
            background: #f9f9f9;
        }
        
        .bathroom-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }
        
        .bathroom-badge.mens {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .bathroom-badge.womens {
            background: #fce4ec;
            color: #c2185b;
        }
        
        .bathroom-badge.accessible {
            background: #e0f2f1;
            color: #00897b;
        }
        
        .tasks-list {
            font-size: 13px;
            line-height: 1.6;
            max-width: 300px;
        }
        
        .task-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .task-item::before {
            content: '✓';
            color: #4caf50;
            font-weight: bold;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .filters {
                flex-direction: column;
            }
            
            .filter-group {
                width: 100%;
            }
            
            select {
                width: 100%;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Cleaning Records</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="switchToForm()">Add New Record</button>
                <button class="btn btn-secondary" onclick="goHome()">← Back</button>
            </div>
        </div>
        
        <div id="message"></div>
        
        <div class="filters">
            <div class="filter-group">
                <label for="bathroomFilter">Bathroom:</label>
                <select id="bathroomFilter" onchange="applyFilters()">
                    <option value="all">All Bathrooms</option>
                    <option value="mens">Mens</option>
                    <option value="womens">Womens</option>
                    <option value="accessible">Accessible</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="dateFilter">Date Range:</label>
                <select id="dateFilter" onchange="applyFilters()">
                    <option value="all">All Time</option>
                    <option value="today">Today</option>
                    <option value="week">Last 7 Days</option>
                    <option value="month">Last 30 Days</option>
                </select>
            </div>
        </div>
        
        <div id="stats" class="stats" style="display: none;"></div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading records...</p>
        </div>
        
        <div id="content" style="display: none;">
            <div class="table-wrapper">
                <table id="recordsTable">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Bathroom</th>
                            <th>Initials</th>
                            <th>Tasks Completed</th>
                        </tr>
                    </thead>
                    <tbody id="recordsBody">
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📋</div>
                <p>No cleaning records found.</p>
            </div>
        </div>
    </div>
    
    <script>
        let allRecords = [];
        let filteredRecords = [];
        
        async function loadRecords() {
            try {
                const response = await fetch('/.netlify/functions/get-cleaning-records');
                if (response.ok) {
                    allRecords = await response.json();
                    applyFilters();
                } else {
                    showMessage('Error loading records', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Connection error. Please refresh to try again.', 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            }
        }
        
        function applyFilters() {
            const bathroomFilter = document.getElementById('bathroomFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;
            
            filteredRecords = allRecords.filter(record => {
                // Bathroom filter
                if (bathroomFilter !== 'all' && record.bathroom !== bathroomFilter) {
                    return false;
                }
                
                // Date filter
                if (dateFilter !== 'all') {
                    const recordDate = new Date(record.datetime);
                    const now = new Date();
                    const diffMs = now - recordDate;
                    const diffDays = diffMs / (1000 * 60 * 60 * 24);
                    
                    if (dateFilter === 'today') {
                        return diffDays <= 1;
                    } else if (dateFilter === 'week') {
                        return diffDays <= 7;
                    } else if (dateFilter === 'month') {
                        return diffDays <= 30;
                    }
                }
                
                return true;
            });
            
            renderTable();
            updateStats();
        }
        
        function renderTable() {
            const tbody = document.getElementById('recordsBody');
            const emptyState = document.getElementById('emptyState');
            
            tbody.innerHTML = '';
            
            if (filteredRecords.length === 0) {
                emptyState.style.display = 'block';
                document.getElementById('recordsTable').style.display = 'none';
                return;
            }
            
            emptyState.style.display = 'none';
            document.getElementById('recordsTable').style.display = 'table';
            
            // Sort by date descending
            const sorted = [...filteredRecords].sort((a, b) => 
                new Date(b.datetime) - new Date(a.datetime)
            );
            
            sorted.forEach(record => {
                const date = new Date(record.datetime);
                const dateStr = date.toLocaleString();
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${dateStr}</td>
                    <td><span class="bathroom-badge ${record.bathroom}">${record.bathroom}</span></td>
                    <td><strong>${record.initials}</strong></td>
                    <td>
                        <div class="tasks-list">
                            ${record.tasks.map(task => `<div class="task-item">${task}</div>`).join('')}
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
        
        function updateStats() {
            const statsDiv = document.getElementById('stats');
            
            if (filteredRecords.length === 0) {
                statsDiv.style.display = 'none';
                return;
            }
            
            statsDiv.style.display = 'grid';
            
            const totalRecords = filteredRecords.length;
            const uniqueEmployees = new Set(filteredRecords.map(r => r.initials)).size;
            const uniqueBathrooms = new Set(filteredRecords.map(r => r.bathroom)).size;
            const completionRate = Math.round(
                (filteredRecords.reduce((sum, r) => sum + r.tasks.length, 0) / 
                (filteredRecords.length * 7)) * 100
            );
            
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${totalRecords}</div>
                    <div class="stat-label">Total Cleanings</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${uniqueEmployees}</div>
                    <div class="stat-label">Employees</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${uniqueBathrooms}</div>
                    <div class="stat-label">Bathrooms</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${completionRate}%</div>
                    <div class="stat-label">Avg Tasks Done</div>
                </div>
            `;
        }
        
        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = 'message ' + type;
        }
        
        function switchToForm() {
            window.location.href = 'index.html';
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
        
        // Load records on page load
        loadRecords();
    </script>
</body>
</html>
